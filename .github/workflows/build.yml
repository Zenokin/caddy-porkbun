name: Build custom Caddy

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-caddy
  cancel-in-progress: false

env:
  REGISTRY: 'ghcr.io'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and check Git tag
        id: caddy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api repos/caddyserver/caddy/releases/latest --jq '.tag_name')
          version=${release#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="caddy-v$version"
          image="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          build=true

          git fetch --tags origin
          if [[ "$EVENT_NAME" == "schedule" ]] && git show-ref --verify --quiet "refs/tags/$tag"; then
            build=false
          fi

          echo "version=version">>"GITHUB_OUTPUT"
          echo "tag=tag">>"GITHUB_OUTPUT"
          echo "image=image">>"GITHUB_OUTPUT"
          echo "build=build">>"GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.caddy.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.caddy.outputs.version }}
          tags: |
            {{ steps.caddy.outputs.image }}:{{ steps.caddy.outputs.version }}

      - name: Tag successfully published version
        if: steps.caddy.outputs.build == 'true'
        env:
          TAG: ${{ steps.caddy.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
